=# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # The server bundle of your Next.js app is memory-intensive.
  # We recommend setting this to at least 1GiB for production apps.
  minInstances: 0
  maxInstances: 1
  memoryMiB: 512
# Static content is cached by default.
# https://firebase.google.com/docs/app-hosting/configure#cache-control
headers:
  - source: /_next/static/**
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
